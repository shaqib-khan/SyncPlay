services:
  - type: web
    name: syncplay-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://frontend-topaz-nine-41.vercel.app
      - key: JWT_SECRET
        generateValue: true

